# On every push: make/check.sh, in an Arch container (what CachyOS has at hand).
name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm git python python-pillow librsvg papirus-icon-theme kconfig kiconthemes diffutils
      - uses: actions/checkout@v4
      - run: make/check.sh
