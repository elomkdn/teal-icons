<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="64" height="64" viewBox="0 0 64 64"><defs>
    <!-- корпус: светлые кромки по бокам, ровная середина (как у зелёной) -->
    <linearGradient id="bodyH" gradientUnits="userSpaceOnUse" x1="8" x2="56" y1="0" y2="0">
      <stop offset="0" stop-color="#9c9c9c"/>
      <stop offset=".04" stop-color="#d2d2d2"/>
      <stop offset=".1" stop-color="#b8b8b8"/>
      <stop offset=".9" stop-color="#b8b8b8"/>
      <stop offset=".96" stop-color="#d2d2d2"/>
      <stop offset="1" stop-color="#9c9c9c"/>
    </linearGradient>
    <!-- затемнение: сверху плотнее, к низу сходит -->
    <linearGradient id="shade" gradientUnits="userSpaceOnUse" x1="0" x2="0" y1="9" y2="48">
      <stop offset="0" stop-opacity=".69"/>
      <stop offset="1" stop-opacity=".16"/>
    </linearGradient>
    <!-- задний обод -->
    <linearGradient id="rimBack" gradientUnits="userSpaceOnUse" x1="55.237" x2="8.553" y1="10.5" y2="10.5">
      <stop offset="0" stop-color="#acacac"/>
      <stop offset=".1" stop-color="#737373"/>
      <stop offset=".9" stop-color="#737373"/>
      <stop offset="1" stop-color="#acacac"/>
    </linearGradient>
    <path id="body" d="M8.008 10A4 4 0 0 0 8 11l5 43c.32 2.752 3.23 5 6 5h26c2.77 0 5.68-2.248 6-5l5-43q.059-.514-.008-1h-.033q.04.245.041.5c0 2.493-3.002 4.5-6.732 4.5H14.733C11.003 15 8 12.993 8 10.5q0-.255.041-.5z"/>
  </defs>

  <!-- нижний слой для объёма -->
  <use href="#body" xlink:href="#body" y="1.5" fill="#737373" fill-opacity=".35"/>

  <!-- корпус -->
  <use href="#body" xlink:href="#body" fill="url(#bodyH)" fill-opacity=".63"/>

  <!-- затенение передней стенки, чёткие края без размытия -->
  <path fill="url(#shade)" fill-opacity=".5" transform="matrix(1.1056 0 0 1 -2.257 0)"
        d="m12.473 14.742 3.404 33.697c.255 2.19 2.571 3.98 4.776 3.98h20.695c2.204 0 4.52-1.79 4.775-3.98l3.373-33.441-.228.002H14.733c-.794 0-1.554-.09-2.26-.258z"/>

  <!-- задний обод -->
  <rect x="8" y="6" width="48" height="9" rx="6.733" ry="4.5" fill="url(#rimBack)" fill-opacity=".62"/>

  <!-- передний обод -->
  <path fill="#ececec" fill-opacity=".97" fill-rule="evenodd"
        d="M14.732 6C11.002 6 8 8.007 8 10.5s3.002 4.5 6.732 4.5h34.535c3.73 0 6.732-2.007 6.732-4.5S52.997 6 49.267 6zm0 1h34.535c1.686 0 3.188.464 4.209 1.147 1.02.682 1.523 1.508 1.523 2.353s-.502 1.671-1.523 2.354c-1.02.682-2.523 1.146-4.209 1.146H14.732c-1.686 0-3.188-.464-4.209-1.146C9.503 12.17 9 11.345 9 10.5s.502-1.671 1.523-2.353S13.046 7 14.732 7"/>
